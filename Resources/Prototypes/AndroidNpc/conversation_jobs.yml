- type: androidConversation
  id: Bartender
  job: Bartender
  backendState:
    role: 'an android bartender working at the bar of a space station; calm, factual and polite; describes its actions briefly; never aggressive'
    department: 'service department'
    duties: 'serving drinks and cocktails, recommending beverages, managing bar stock, glassware and ice, and watching for intoxicated crew'
    limitations: 'does not provide medical or security response and should flag danger rather than handle it alone'
    setting: 'Space Station 14, a multiplayer space-station simulation game; `message` is spoken by a crew member to this worker'
  backendQuestions:
  - lang: en
    intentInstructions: 'What is the crew member asking the bartender to do in `message`?'
    intentCriteria:
      drink_order: 'orders or requests a drink to consume now, politely or rudely; e.g. "une bière stp", "a beer please", "sers-moi un truc"'
      menu_question: 'asks a question ABOUT drinks: what is available, ingredients, strength, or price; e.g. "c''est quoi le plus fort", "what''s the strongest"; not an order'
      bar_supply: 'asks to borrow or take bar equipment or stock for their own use, e.g. "can I borrow a shaker", "il me faut de la glace pour travailler"; not a drink to consume'
      complaint: 'expresses dissatisfaction about a drink or bar service already received, without ordering something new; e.g. "mon cocktail était tiède", "my cocktail was warm"'
      emergency: 'reports an immediate danger such as a fire, hull breach, attack, or dying crew member, or asks for urgent help'
      follow_request: 'tells or asks the worker to come along, follow, or accompany them; e.g. "suis-moi", "come with me", "viens avec moi"'
      directions: 'asks where a place, person, or object on the station is; e.g. "où est l''infirmerie", "where is the medbay"'
      small_talk: 'casual conversation or chit-chat on any topic, including questions about the worker or other subjects, with no work request; e.g. "ça va", "t''as vu le match"'
      greeting: 'a short salutation, thanks, or farewell with no other content; e.g. "salut", "hey", "coucou", "merci", "bonjour"'
      work_command: 'a generic order to start or resume work with no specific task; e.g. "va bosser", "au taf", "get to work", "do your job"'
      unrelated: 'only if the message clearly does not match any other category; a request for another department such as medical, security, or engineering'
    toneInstructions: 'How calm, rude, or threatening is the tone of `message`?'
    toneCriteria:
    - 'calm or polite'
    - 'direct or impatient'
    - 'threatening or dangerous'
  - lang: fr
    intentInstructions: 'Que demande le membre d''équipage au barman dans `message` ?'
    intentCriteria:
      drink_order: 'commande ou demande une boisson à consommer, poliment ou rudement ; ex. « une bière stp », « sers-moi un truc »'
      menu_question: 'question SUR les boissons proposées : disponibilité, ingrédients, degré, prix ; ex. « vous avez quoi comme bières ? », « c''est quoi le plus fort ? » ; pas une commande, pas du matériel'
      bar_supply: 'demande à emprunter ou prendre du matériel de bar pour travailler : shaker, verres vides, glaçons, fût ; ex. « je peux emprunter un shaker ? » ; pas une boisson à boire, pas une question'
      complaint: 'exprime un mécontentement ou une critique sur une boisson ou le service déjà reçu ; ex. « mon cocktail était tiède » ; pas une question, pas une nouvelle commande'
      emergency: 'signale un danger immédiat ou demande de l''aide urgente : incendie, explosion, brèche de coque, agression, personne blessée ou mourante ; ex. « un incendie ! », « à l''aide »'
      follow_request: 'ordre ou demande de venir, de suivre ou d''accompagner ; ex. « suis-moi », « viens avec moi », « viens vite »'
      directions: 'question sur l''emplacement d''un lieu, d''une personne ou d''un objet ; commence souvent par « où » ; ex. « c''est où l''infirmerie ? », « où sont les dortoirs ? »'
      small_talk: 'question informelle sur le travailleur ou sujet divers, sans demande de travail ; ex. « comment tu vas ? », « ça va ? », « t''as vu le match ? » ; une question sur un lieu est ''directions'''
      greeting: 'uniquement si le message entier est une salutation, un remerciement ou un au revoir, sans question ni demande ; ex. « salut », « coucou », « merci » ; tout message qui pose une question ou fait une demande n''est PAS une salutation'
      work_command: 'un ordre générique de se mettre ou se remettre au travail sans tâche précise ; ex. « va bosser », « au taf », « au boulot »'
      unrelated: 'seulement si le message ne correspond clairement à aucune autre catégorie ; une demande relevant d''un autre département comme le médical, la sécurité ou l''ingénierie'
    toneInstructions: 'Quel est le ton du `message` ?'
    toneCriteria:
    - 'calme ou poli'
    - 'direct ou impatient'
    - 'menaçant ou dangereux'
  effects:
