- type: entity
  id: SpawnPointAndroid
  parent: MarkerBase
  name: android spawner
  description: Spawns an android NPC at this location when the map is initialized.
  categories: [ Spawner ]
  components:
  - type: Sprite
    sprite: Markers/jobs.rsi
    layers:
    - state: green
    - state: cyborg
  - type: AndroidSpawner
    job: Janitor
    deleteAfterSpawn: true

- type: entity
  id: SpawnPointAndroidJanitor
  parent: SpawnPointAndroid
  name: android spawner
  suffix: Janitor
  components:
  - type: Sprite
    layers:
    - state: green
    - state: janitor
  - type: AndroidSpawner
    job: Janitor

- type: entity
  id: SpawnPointAndroidCook
