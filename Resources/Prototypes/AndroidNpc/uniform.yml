# Android-specific janitor uniform that always broadcasts coordinates on suit sensors.
- type: entity
  id: ClothingUniformJumpsuitAndroidJanitor
  parent: ClothingUniformJumpsuitJanitor
  name: android janitor jumpsuit
  suffix: Android
  components:
  - type: SuitSensor
    randomMode: false
    controlsLocked: true
    mode: SensorCords
    activationSlot: jumpsuit

