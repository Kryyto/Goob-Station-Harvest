- type: entity
  id: RandomArcade
  name: random arcade spawner
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: red
      - sprite: Structures/Machines/arcade.rsi
        state: icon
  - type: RandomSpawner
    prototypes:
      - BlockGameArcade
      - SpaceVillainArcadeFilled
      - AstroMinerArcadeFilled # Harvest
    chance: 1
    keepRotation: true # Harvest: arcades face the way they were mapped