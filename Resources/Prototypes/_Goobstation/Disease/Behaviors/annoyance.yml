- type: entity
  id: DiseaseBehaviorVomit
  parent: DiseaseBehaviorBase
  name: Vomissements
  description: Vous fait vomir périodiquement.
  components:
  - type: DiseaseEffect
    complexity: 8 # can make you constantly hungry
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:Vomit
  # also a low-power infect
  - type: DiseaseSpreadEffect
    arc: 360
    range: 2
    timeScale: false
    spreadParams:
      power: 0.5
      chance: 0.5
      spreadType: Aerial
  - type: DiseasePeriodicCondition
    delayMin: 20
    delayMax: 60

- type: entity
  id: DiseaseBehaviorFeelUnwell
  parent: DiseaseBehaviorBase
  name: Malaise général
  description: Vous donne une sensation de malaise.
  components:
  - type: DiseaseEffect
    complexity: 4 # just an annoyance
  - type: DiseasePopupEffect
    string: disease-effect-popup-default
  - type: DiseasePeriodicCondition
    delayMin: 30
    delayMax: 60
  - type: DiseaseProgressCondition
    minProgress: 0.4

- type: entity
  id: DiseaseBehaviorHeadache
  parent: DiseaseBehaviorBase
  name: Maux de tête
  description: Vous donne des maux de tête qui peuvent rendre le travail plus difficile.
  components:
  - type: DiseaseEffect
    complexity: 8 # very annoying
  - type: DiseasePopupEffect
    string: disease-effect-popup-headache
  - type: DiseasePeriodicCondition
    delayMin: 3
    delayMax: 12
  - type: DiseaseFlashEffect
    timeScale: false
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorGravitosisA
  parent: DiseaseBehaviorBase
  name: Gravitose A
  description: Symptôme de maladie rare et exotique qui fait tourbillonner des objets autour de vous.
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    timeScale: false
    component: GravityWell
    defaults:
      BaseTangentialAcceleration: 6
  - type: GravityWell
    maxRange: 4

- type: entity
  id: DiseaseBehaviorGravitosisB
  parent: DiseaseBehaviorBase
  name: Gravitose B
  description: Symptôme de maladie rare et exotique qui attire des objets vers vous.
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    timeScale: false
    component: GravityWell
    defaults:
      BaseRadialAcceleration: 6
  - type: GravityWell
    maxRange: 4

- type: entity
  id: DiseaseBehaviorGravitosisC
  parent: DiseaseBehaviorBase
  name: Gravitose C
  description: Symptôme de maladie rare et exotique qui repousse des objets loin de vous.
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    timeScale: false
    component: GravityWell
    defaults:
      BaseRadialAcceleration: -6
  - type: GravityWell
    maxRange: 4

- type: entity
  id: DiseaseBehaviorOwO
  parent: DiseaseBehaviorBase
  name: OwOification
  description: Symptôme de maladie rare et exotique qui vous fait vocaliser comme un chat.
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGrantComponentEffect
    components:
    - type: OwOAccent

- type: entity
  id: DiseaseBehaviorBlindness
  parent: DiseaseBehaviorBase
  name: Blindness
  description: Rare disease symptom that causes complete blindness.
  components:
  - type: DiseaseEffect
    complexity: 12
  - type: DiseaseGrantComponentEffect
    components:
    - type: PermanentBlindness
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorPainNumbness
  parent: DiseaseBehaviorBase
  name: Analgesia
  description: Rare disease symptom that causes you to become insensitive to pain.
  components:
  - type: DiseaseEffect
    complexity: 12
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:ModifyStatusEffect
      effectProto: PainNumbnessTraitStatusEffect
      time: 20

- type: entity
  id: DiseaseBehaviorDeaf
  parent: DiseaseBehaviorBase
  name: Deafness
  description: Rare disease symptom that causes complete deafness.
  components:
  - type: DiseaseEffect
    complexity: 14 # VERY annoying
  - type: DiseaseGrantComponentEffect
    components:
    - type: Deaf
  - type: DiseaseProgressCondition
    minProgress: 0.6

- type: entity
  id: DiseaseBehaviorAnxiety
  parent: DiseaseBehaviorBase
  name: Anxiety
  description: Causes anxiety and fear of hugs.
  components:
  - type: DiseaseEffect
    complexity: 2
  - type: DiseaseGrantComponentEffect
    components:
    - type: SocialAnxiety

- type: entity
  id: DiseaseBehaviorDrowsiness
  parent: DiseaseBehaviorBase
  name: Drowsiness
  description: Causes a strong desire to sleep.
  components:
  - type: DiseaseEffect
    complexity: 10
  - type: DiseaseReagentEffect
    timeScale: true
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectDrowsiness
      time: 30
  - type: DiseaseEmoteEffect
    emote: Yawn
  - type: DiseasePeriodicCondition
    delayMin: 15
    delayMax: 60

- type: entity
  id: DiseaseBehaviorEuphoria
  parent: DiseaseBehaviorBase
  name: Euphoria
  description: Symptom that causes happiness!
  components:
  - type: DiseaseEffect
    complexity: 5
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectSeeingRainbow
      time: 20
  - type: DiseasePeriodicCondition
    delayMin: 10
    delayMax: 50
  - type: DiseaseEmoteEffect
    emote: Laugh

- type: entity
  id: DiseaseBehaviorApathy
  parent: DiseaseBehaviorBase
  name: Apathy
  description: Symptom that makes the world progressively lose its range of colors.
  components:
  - type: DiseaseEffect
    complexity: 5
  - type: DiseaseGrantComponentEffect
    components:
    - type: BlackAndWhiteOverlay
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorBS
  parent: DiseaseBehaviorBase
  name: Bluespace Instability
  description: Extremely rare symptom that causes you to teleport erratically.
  components:
  - type: DiseaseEffect
    complexity: 40 #there is a chance of ending up in a wall or in space
  - type: DiseaseGrantComponentEffect
    components:
    - type: ChaoticJump
      jumpMinInterval: 0
      jumpMaxInterval: 60
      rangeMin: 0.2
      rangeMax: 2
  - type: DiseaseProgressCondition
    minProgress: 0.5
